name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  HUSKY: '0'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps

      - name: Install web-client dependencies
        working-directory: ./web-client
        run: npm install --legacy-peer-deps

      - name: Lint mobile-app
        working-directory: ./mobile-app
        run: npm run lint || true

      - name: Lint web-client
        working-directory: ./web-client
        run: npm run lint || true

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint || true

  build-mobile:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./mobile-app
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: ./mobile-app
        run: npx tsc --noEmit || true

      - name: Build Android
        run: |
          if [ -d mobile-app/android ]; then
            cd mobile-app/android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || echo "Build would require Android SDK"
          else
            echo "Android directory not found, skipping"
          fi

      - name: Build iOS
        run: |
          if [ -d mobile-app/ios ]; then
            cd mobile-app/ios
            pod install || echo "iOS build would require macOS"
          else
            echo "iOS directory not found, skipping"
          fi

  build-contracts:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./blockchain
        run: npm install --legacy-peer-deps

      - name: Compile contracts
        working-directory: ./blockchain
        run: npx hardhat compile

      - name: Run tests
        working-directory: ./blockchain
        run: npx hardhat test

  build-web:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./web-client
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: ./web-client
        run: npm run build
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'

  build-edge-substrate:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./edge-substrate
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: ./edge-substrate
        run: npx tsc --noEmit
