name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  HUSKY: '0'

jobs:

  deploy-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./mobile-app
        run: npm install --legacy-peer-deps

      - name: Build Android Release
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk

  deploy-ios:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./mobile-app
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        working-directory: ./mobile-app/ios
        run: pod install || echo "[skip] No Podfile yet"

      - name: Build iOS
        run: |
          cd mobile-app/ios
          xcodebuild \
            -workspace FieldCommander.xcworkspace \
            -scheme FieldCommander \
            -archivePath build/FieldCommander.xcarchive \
            -sdk iphoneos archive || echo "[skip] Xcode workspace not yet present"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile-app/ios/build/FieldCommander.xcarchive
        if: always()

  deploy-contract:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install blockchain dependencies
        working-directory: ./blockchain
        run: npm install --legacy-peer-deps

      - name: Compile contracts
        working-directory: ./blockchain
        run: npx hardhat compile

      - name: Deploy to Polygon Amoy (testnet)
        working-directory: ./blockchain
        run: npx hardhat run scripts/deploy.ts --network amoy
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          VERIFIER_ADDRESS: ${{ secrets.VERIFIER_ADDRESS }}
          POLYGON_AMOY_RPC: ${{ secrets.POLYGON_AMOY_RPC }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}

  deploy-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-client dependencies
        working-directory: ./web-client
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        working-directory: ./web-client
        run: npm run build
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_EDGE_URL: ${{ secrets.EDGE_SUBSTRATE_URL }}
          REACT_APP_BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dashboard
          path: web-client/build/
